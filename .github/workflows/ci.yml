
name: Task Manager CI

on:
  push:
    branches:
      - main
      - "dev/**"
      - "sprint-1/**"
      - "sprint-2/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  baseline:
    name: Validate Clean Baseline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify required files
        run: |
          test -f docs/INTEGRATION_CONTRACT.md
          test -f Task_Manager_SAD.pdf
          test -f Task_Manager_SRS_updated.pdf
          test -f Task_Manager_Test_Plan.pdf

      - name: Verify old implementation is removed
        run: |
          test ! -d frontend
          test ! -d backend
