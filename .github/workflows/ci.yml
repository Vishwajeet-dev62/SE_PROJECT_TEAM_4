name: Task Manager CI

on:
  push:
    branches:
      - main
      - "dev/**"
      - "sprint-1/**"
      - "sprint-2/**"
      - "feat/**"
      - "feature/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Verify required project documents
        run: |
          test -f docs/INTEGRATION_CONTRACT.md

      - name: Verify rebuilt frontend files
        run: |
          test -f frontend/package.json
          test -f frontend/package-lock.json
          test -f frontend/src/main.jsx

      - name: Validate backend JavaScript syntax
        run: |
          find backend/src backend/tests -type f -name '*.js' -print0 |
            xargs -0 -r -n 1 node --check

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Run backend tests
        working-directory: backend
        run: npm test

  frontend:
    name: Test frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Run frontend tests
        run: npm test --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend
